name: Release Check

on:
  pull_request:
    branches:
      - master

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::collapsible-if

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features des_sim_test_mode

  examples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --examples --features des_sim_test_mode

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --doc --features des_sim_test_mode

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - uses: Swatinem/rust-cache@v2
      - name: Audit
        run: |
          cargo audit > audit.txt 2>&1 || true

          if grep -q "Warning:" audit.txt; then
            echo "## ⚠️ Cargo Audit" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat audit.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            echo "::warning::Cargo audit reported advisories"
          fi

  changelog-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changelog exists for version
        run: |
          VERSION=$(grep '^version =' Cargo.toml \
            | head -1 \
            | sed 's/version = "\(.*\)"/\1/')
          
          FILE="changelog/v${VERSION}.md"
          
          echo "Checking: $FILE"
          if [ ! -f "$FILE" ]; then
            echo "❌ $FILE not found"
            exit 1
          fi
          
          if [ ! -s "$FILE" ]; then
            echo "❌ $FILE is empty"
            exit 1
          fi
          
          echo "✅ changelog exists"

  # TODO cargo publish --dry-runを入れてもいいころにpublish-checkとしてここに追加する。
